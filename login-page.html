<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Garage - Ford Mustang V8 Ignition Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --neon-red: #ff0055;
      --neon-cyan: #00f3ff;
      --neon-amber: #ffaa00;
      --hud-bg: rgba(6, 10, 18, 0.88);
      --border-cyan: rgba(0, 243, 255, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #030508;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      perspective: 1000px;
      transition: background 0.5s ease;
    }

    /* --- FULL-SCREEN EARTHQUAKE / MUSTANG V8 ENGINE SHAKE --- */
    body.fullscreen-engine-cranking {
      animation: fullScreenEarthquake 0.07s infinite alternate ease-in-out !important;
    }

    @keyframes fullScreenEarthquake {
      0% { transform: translate(8px, 6px) rotate(0.6deg); }
      20% { transform: translate(-10px, -7px) rotate(-0.7deg); }
      40% { transform: translate(7px, -8px) rotate(0.5deg); }
      60% { transform: translate(-9px, 8px) rotate(-0.6deg); }
      80% { transform: translate(10px, 3px) rotate(0.7deg); }
      100% { transform: translate(-6px, -5px) rotate(-0.4deg); }
    }

    /* Background Holographic Grid */
    .bg-grid {
      position: absolute;
      width: 250%;
      height: 250%;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      transform: rotateX(60deg) translateY(-20%);
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: rotateX(60deg) translateY(0); }
      100% { transform: rotateX(60deg) translateY(50px); }
    }

    /* Ambient Lighting Glows */
    .glow-spot {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      pointer-events: none;
    }
    .glow-1 { top: 10%; left: 15%; background: var(--neon-cyan); }
    .glow-2 { bottom: 10%; right: 15%; background: var(--neon-red); }

    /* 3D Glass Cockpit Card */
    .hud-card {
      position: relative;
      width: 460px;
      padding: 40px;
      background: var(--hud-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-cyan);
      clip-path: polygon(
        0 40px, 40px 0, 
        calc(100% - 40px) 0, 100% 40px, 
        100% calc(100% - 40px), calc(100% - 40px) 100%, 
        40px 100%, 0 calc(100% - 40px)
      );
      box-shadow: 
        0 0 30px rgba(0, 243, 255, 0.15),
        inset 0 0 25px rgba(0, 243, 255, 0.05);
      transform: rotateX(6deg) rotateY(-4deg);
      transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1), border-color 0.3s ease;
      z-index: 10;
    }

    .engine-online-card {
      border-color: var(--neon-cyan) !important;
      box-shadow: 0 0 60px rgba(0, 243, 255, 0.6), inset 0 0 30px rgba(0, 243, 255, 0.2) !important;
    }

    /* Corner Brackets */
    .corner-bracket {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--neon-cyan);
      border-style: solid;
      pointer-events: none;
    }
    .cb-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
    .cb-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
    .cb-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
    .cb-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

    /* Telemetry Header */
    .telemetry-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    .rpm-gauge {
      width: 200px;
      height: 12px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      gap: 3px;
      padding: 2px;
      margin-bottom: 12px;
      border: 1px solid rgba(0, 243, 255, 0.2);
    }

    .rpm-bar {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      animation: revUp 3s infinite ease-in-out;
    }

    .rpm-bar:nth-child(n+1):nth-child(-n+6) { background: var(--neon-cyan); }
    .rpm-bar:nth-child(n+7):nth-child(-n+9) { background: var(--neon-amber); }
    .rpm-bar:nth-child(10) { background: var(--neon-red); }

    body.fullscreen-engine-cranking .rpm-bar {
      animation: maxRPM 0.04s infinite alternate !important;
    }

    @keyframes maxRPM {
      0% { opacity: 0.1; }
      100% { opacity: 1; filter: drop-shadow(0 0 12px currentColor); }
    }

    @keyframes revUp {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; filter: drop-shadow(0 0 5px currentColor); }
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .brand-title span {
      color: var(--neon-cyan);
    }

    .system-status {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      margin-top: 4px;
      opacity: 0.8;
    }

    /* Form Fields */
    .input-field {
      position: relative;
      margin-bottom: 25px;
    }

    .input-field label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: #8fa3b8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-field label span {
      color: var(--neon-cyan);
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0, 243, 255, 0.03);
      border: 1px solid rgba(0, 243, 255, 0.2);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 1px;
      outline: none;
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
      background: rgba(0, 243, 255, 0.08);
      border-color: var(--neon-cyan);
      box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.2);
    }

    /* Ignition Start Button */
    .ignition-container {
      display: flex;
      justify-content: center;
      margin-top: 35px;
    }

    .btn-ignition {
      position: relative;
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #120008 0%, #360014 100%);
      border: 2px solid var(--neon-red);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
      transition: all 0.3s ease;
    }

    .btn-ignition:hover {
      background: var(--neon-red);
      color: #000;
      box-shadow: 0 0 40px rgba(255, 0, 85, 0.8);
    }

    .hud-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      font-size: 0.75rem;
      color: #5c708a;
      letter-spacing: 1px;
    }

    .hud-footer a {
      color: var(--neon-cyan);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Background VFX -->
  <div class="glow-spot glow-1"></div>
  <div class="glow-spot glow-2"></div>
  <div class="bg-grid"></div>

  <!-- HUD Interface Card -->
  <div class="hud-card" id="hudCard">
    <div class="corner-bracket cb-tl"></div>
    <div class="corner-bracket cb-tr"></div>
    <div class="corner-bracket cb-bl"></div>
    <div class="corner-bracket cb-br"></div>

    <div class="telemetry-header">
      <div class="rpm-gauge">
        <div class="rpm-bar" style="animation-delay: 0.1s"></div>
        <div class="rpm-bar" style="animation-delay: 0.2s"></div>
        <div class="rpm-bar" style="animation-delay: 0.3s"></div>
        <div class="rpm-bar" style="animation-delay: 0.4s"></div>
        <div class="rpm-bar" style="animation-delay: 0.5s"></div>
        <div class="rpm-bar" style="animation-delay: 0.6s"></div>
        <div class="rpm-bar" style="animation-delay: 0.7s"></div>
        <div class="rpm-bar" style="animation-delay: 0.8s"></div>
        <div class="rpm-bar" style="animation-delay: 0.9s"></div>
        <div class="rpm-bar" style="animation-delay: 1.0s"></div>
      </div>
      <div class="brand-title">SPORTS<span>GARAGE</span></div>
      <div class="system-status" id="sysStatus">MUSTANG 5.0 V8 READINESS // STANDBY</div>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="input-field">
        <label for="pilot-id">GMAIL PILOT ID <span>[@GMAIL.COM ONLY]</span></label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="pilot-id" 
            placeholder="drivername@gmail.com" 
            pattern="[a-zA-Z0-9._%+-]+@gmail\.com$" 
            title="Please enter a valid @gmail.com address"
            required 
            autocomplete="off">
        </div>
      </div>

      <div class="input-field">
        <label for="access-code">SECURITY PASSCODE <span>[ENCRYPTED]</span></label>
        <div class="input-wrapper">
          <input type="password" id="access-code" placeholder="••••••••••••" required>
        </div>
      </div>

      <div class="ignition-container">
        <button type="submit" class="btn-ignition" id="ignitionBtn">
          ENGINE START // IGNITE V8
        </button>
      </div>

      <div class="hud-footer">
        <span id="engineStatusText">ENGINE: OFF</span>
        <a href="#">SYSTEM RECOVERY</a>
      </div>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const hudCard = document.getElementById('hudCard');
    const ignitionBtn = document.getElementById('ignitionBtn');
    const sysStatus = document.getElementById('sysStatus');
    const engineStatusText = document.getElementById('engineStatusText');

    /* --- LOUD 4-SECOND FORD MUSTANG 5.0L V8 AUDIO SYNTHESIZER --- */
    function playMustangV8Sound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      
      const ctx = new AudioContext();

      // Master Gain for High Loudness
      const masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(0.85, ctx.currentTime);
      masterGain.connect(ctx.destination);

      // Distorted Lowpass Filter for Throaty Exhaust Note
      const exhaustFilter = ctx.createBiquadFilter();
      exhaustFilter.type = 'lowpass';
      exhaustFilter.frequency.setValueAtTime(400, ctx.currentTime);
      exhaustFilter.Q.setValueAtTime(4, ctx.currentTime);
      exhaustFilter.connect(masterGain);

      // --- PHASE 1: STARTER MOTOR CRANK (0.0s -> 1.2s) ---
      const crankOsc = ctx.createOscillator();
      const crankGain = ctx.createGain();
      crankOsc.type = 'sawtooth';
      crankOsc.frequency.setValueAtTime(35, ctx.currentTime);
      crankOsc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 1.2);

      crankGain.gain.setValueAtTime(0.5, ctx.currentTime);
      crankGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.3);

      crankOsc.connect(exhaustFilter);
      crankGain.connect(exhaustFilter);
      crankOsc.start();
      crankOsc.stop(ctx.currentTime + 1.3);

      // --- PHASE 2: EXPLOSIVE MUSTANG 5.0 V8 ROAR & REV (1.2s -> 4.0s) ---
      setTimeout(() => {
        // Dual Detuned Oscillators for Heavy Muscle V8 Growl
        const v8Osc1 = ctx.createOscillator();
        const v8Osc2 = ctx.createOscillator();
        const roarGain = ctx.createGain();

        v8Osc1.type = 'sawtooth';
        v8Osc2.type = 'square';

        // Detune by 15 cents for heavy V8 exhaust thrum
        v8Osc1.detune.setValueAtTime(0, ctx.currentTime);
        v8Osc2.detune.setValueAtTime(15, ctx.currentTime);

        // Aggressive Mustang V8 Pitch Sweep (Starter Catch -> Explosive Rev -> Heavy Idle Drop)
        v8Osc1.frequency.setValueAtTime(140, ctx.currentTime);
        v8Osc1.frequency.exponentialRampToValueAtTime(480, ctx.currentTime + 0.4); // Explosive Rev up
        v8Osc1.frequency.exponentialRampToValueAtTime(95, ctx.currentTime + 2.7);   // Drop into deep V8 rumble

        v8Osc2.frequency.setValueAtTime(135, ctx.currentTime);
        v8Osc2.frequency.exponentialRampToValueAtTime(470, ctx.currentTime + 0.4);
        v8Osc2.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 2.7);

        // Open Filter wide during the loud rev peak
        exhaustFilter.frequency.setValueAtTime(400, ctx.currentTime);
        exhaustFilter.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.4);
        exhaustFilter.frequency.exponentialRampToValueAtTime(350, ctx.currentTime + 2.7);

        // High Volume Roar
        roarGain.gain.setValueAtTime(0.8, ctx.currentTime);
        roarGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2.7); // Ends exactly at 4s mark

        v8Osc1.connect(exhaustFilter);
        v8Osc2.connect(exhaustFilter);
        v8Osc1.start();
        v8Osc2.start();
        v8Osc1.stop(ctx.currentTime + 2.8);
        v8Osc2.stop(ctx.currentTime + 2.8);
      }, 1200);

      /* NOTE: If you have an actual 'mustang.mp3' file in your folder, 
         you can simply uncomment the line below to play it instead:
         
         const mustangAudio = new Audio('mustang.mp3');
         mustangAudio.play();
      */
    }

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();

      // Play 4-second Loud Mustang V8 Sound
      playMustangV8Sound();

      // 1. Shake the ENTIRE SCREEN for exactly 4 seconds
      document.body.classList.add('fullscreen-engine-cranking');
      
      ignitionBtn.textContent = 'MUSTANG 5.0 V8 FIRING...';
      ignitionBtn.style.background = 'var(--neon-red)';
      ignitionBtn.style.color = '#000';
      sysStatus.textContent = 'CRANKING 8 CYLINDERS...';
      sysStatus.style.color = 'var(--neon-red)';
      engineStatusText.textContent = 'ENGINE: FIRING V8...';

      // 2. Transition after 4000ms (4 full seconds of earthquake shake & roar)
      setTimeout(() => {
        // Stop Fullscreen Earthquake Shake
        document.body.classList.remove('fullscreen-engine-cranking');
        hudCard.classList.add('engine-online-card');

        ignitionBtn.textContent = 'VROOM! MUSTANG V8 ONLINE';
        ignitionBtn.style.background = 'var(--neon-cyan)';
        ignitionBtn.style.borderColor = 'var(--neon-cyan)';

        sysStatus.textContent = 'SYSTEM ONLINE // MUSTANG PERFORMANCE ACTIVE';
        sysStatus.style.color = 'var(--neon-cyan)';
        engineStatusText.textContent = 'ENGINE: 5.0L V8 ACTIVE';
        window.location.href = "index.html";

      }, 4000); // 4000ms = 4 seconds duration
    });
  </script>

</body>
</html>
